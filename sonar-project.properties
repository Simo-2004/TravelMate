sonar.projectKey=Simo-2004_TravelMate
sonar.organization=simo-2004
sonar.projectName=TravelMate
sonar.projectVersion=1.0

sonar.sourceEncoding=UTF-8

# SonarCloud will analyze only the "lib" folder
sonar.sources=lib

# Test location
sonar.tests=test

# Coverage report for Dart/Flutter. Flutter's `flutter test --coverage`
# writes an LCOV report to coverage/lcov.info. The correct import property
# for the Dart analyzer is `sonar.dart.lcov.reportPaths` (NOT the JavaScript
# one) — otherwise the report is never matched to the .dart sources and the
# project shows 0% coverage.
sonar.dart.lcov.reportPaths=coverage/lcov.info

# Exclude tests and generated files from DUPLICATE CODE detection.
sonar.cpd.exclusions=test/**,**/*.g.dart,**/*.freezed.dart

# Exclude generated and bootstrap files from COVERAGE (they are not
# meaningfully unit-testable, so counting them would only dilute the ratio).
sonar.coverage.exclusions=**/*.g.dart,**/*.freezed.dart,lib/generated_plugin_registrant.dart,lib/main.dart
