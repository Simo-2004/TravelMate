sonar.projectKey=Simo-2004_TravelMate
sonar.organization=simo-2004
sonar.projectName=TravelMate
sonar.projectVersion=1.0

# SonarCloud will analyze only the "lib" folder
sonar.sources=lib

# Test location
sonar.tests=test

# Tell to sonarcloud where to find the coverage report (this file will be generated by the command "flutter test --coverage")
sonar.flutter.coverage.reportPaths=coverage/lcov.info

# Exclude the DUPLICATE CODE (Ignore tests and generated files)
sonar.cpd.exclusions=test/**, **/*.g.dart, **/*.freezed.dart

# Exclude generated files from COVERAGE
sonar.coverage.exclusions=**/*.g.dart, **/*.freezed.dart, lib/generated_plugin_registrant.dart, lib/main.dart
