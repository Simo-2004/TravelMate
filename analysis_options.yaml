# Static analysis configuration for TravelMate.
#
# `include` activates the official flutter_lints rule set (the recommended
# lints for Flutter apps, published by the Flutter team). No rules are
# added or disabled below, so the project runs the standard set as-is.
include: package:flutter_lints/flutter.yaml

linter:
  # The rules below are ADDED on top of the flutter_lints defaults included
  # above — flutter_lints does not enable any of these out of the box. They
  # are extra good-practice/style rules, not part of the official base set.
  rules:
    - prefer_single_quotes # consistent string quoting across the codebase
    - prefer_final_locals # locals that are never reassigned must be final
    - prefer_final_in_for_each # for-each loop variables must be final when unmodified
    - unnecessary_lambdas # forbids `(x) => f(x)` where a tear-off `f` would do
    - unawaited_futures # flags fire-and-forget async calls missing await/unawaited()
    - sort_pub_dependencies # keeps pubspec.yaml dependencies alphabetically sorted

# https://dart.dev/guides/language/analysis-options
